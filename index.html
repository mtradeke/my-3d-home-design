<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Home Design Studio - Pro</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(30, 30, 30, 0.95); padding: 20px; border-radius: 12px;
            color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;
            max-height: 90vh; overflow-y: auto;
        }

        h1 { font-size: 18px; margin-bottom: 15px; color: #0066ff; text-transform: uppercase; letter-spacing: 1px; }
        .section-title { font-size: 12px; color: #888; margin: 15px 0 8px 0; text-transform: uppercase; border-bottom: 1px solid #333; padding-bottom: 4px;}

        button {
            width: 100%; padding: 10px; margin-bottom: 8px; background: #2a2a2a;
            border: 1px solid #444; color: white; border-radius: 6px; cursor: pointer;
            font-size: 14px; transition: all 0.2s; text-align: left;
        }
        button:hover { background: #0066ff; border-color: #0066ff; }
        
        .action-btn { background: #444; text-align: center; font-weight: bold; }
        .action-btn:hover { background: #00aa00; }
        .delete-btn { background: #8b0000; text-align: center; }
        .delete-btn:hover { background: #ff3333; }

        .color-picker-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 6px; cursor: pointer; background: none; }
        .instructions { font-size: 11px; color: #666; margin-top: 20px; line-height: 1.5; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h1> Home Design Pro</h1>
        
        <div class="section-title">Structure</div>
        <button onclick="addFloor()">➕ Add Floor Tile</button>
        <button onclick="addWall()">➕ Add Wall</button>
        
        <div class="section-title">Furniture & Fixtures</div>
        <button onclick="addBed()">🛏️ Add Bed</button>
        <button onclick="addDoor()">🚪 Add Door</button>
        <button onclick="addWindow()">🪟 Add Window</button>

        <div class="section-title">Tools</div>
        <div class="color-picker-container">
            <label style="font-size: 14px;">Next Object Color:</label>
            <input type="color" id="colorPicker" value="#0066ff">
        </div>
        
        <button class="action-btn" onclick="rotateSelected()"> Rotate Selected Object</button>
        <button class="delete-btn" onclick="deleteSelected()">🗑️ Delete Selected Object</button>
        <button class="delete-btn" onclick="resetScene()" style="background: #555;">Clear All</button>

        <div class="instructions">
            <strong>Controls:</strong><br>
            🖱️ Left Click Object: Select it (turns red)<br>
            🖱️ Left Click Empty: Deselect<br>
            🖱️ Right Drag: Rotate Camera<br>
            🖱️ Scroll: Zoom
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground Grid
        const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        scene.add(gridHelper);

        // Object Management
        const objects = [];
        let selectedObject = null;
        let currentColor = '#0066ff';
        const originalMaterials = new Map();

        document.getElementById('colorPicker').addEventListener('input', (e) => currentColor = e.target.value);

        function createMaterial(colorHex) {
            return new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.7 });
        }

        function addToScene(mesh) {
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            objects.push(mesh);
            selectObject(mesh); // Auto-select new objects
        }

        // --- BUILDING FUNCTIONS ---
        function addFloor() {
            const geo = new THREE.BoxGeometry(2, 0.1, 2);
            const mat = createMaterial(currentColor);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, 0.05, 0);
            addToScene(mesh);
        }

        function addWall() {
            const geo = new THREE.BoxGeometry(2, 3, 0.2);
            const mat = createMaterial(currentColor);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, 1.5, 0);
            addToScene(mesh);
        }

        function addBed() {
            const group = new THREE.Group();
            const baseMat = createMaterial('#8B4513'); // Brown wood
            const pillowMat = createMaterial('#FFFFFF'); // White pillow
            
            const base = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 3), baseMat);
            base.position.y = 0.25;
            const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 0.5), pillowMat);
            pillow.position.set(0, 0.6, -1.2);
            
            group.add(base); group.add(pillow);
            group.position.set(0, 0, 0);
            addToScene(group);
        }

        function addDoor() {
            const group = new THREE.Group();
            const frameMat = createMaterial('#333333');
            const doorMat = createMaterial('#654321');
            
            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.2), frameMat);
            frame.position.y = 1.1;
            const door = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.0, 0.1), doorMat);
            door.position.set(0, 1.0, 0.05);
            
            group.add(frame); group.add(door);
            addToScene(group);
        }

        function addWindow() {
            const group = new THREE.Group();
            const frameMat = createMaterial('#CCCCCC');
            const glassMat = new THREE.MeshStandardMaterial({ color: '#87CEEB', transparent: true, opacity: 0.5 });
            
            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 0.1), frameMat);
            frame.position.y = 1.5;
            const glass = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 0.05), glassMat);
            glass.position.set(0, 1.5, 0.05);
            
            group.add(frame); group.add(glass);
            addToScene(group);
        }

        // --- SELECTION & TOOLS ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-panel')) return; // Ignore clicks on UI
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(objects, true);
            
            if (intersects.length > 0) {
                // Find the top-level group or mesh
                let obj = intersects[0].object;
                while(obj.parent && obj.parent !== scene) { obj = obj.parent; }
                selectObject(obj);
            } else {
                deselectObject();
            }
        });

        function selectObject(obj) {
            deselectObject();
            selectedObject = obj;
            // Highlight logic
            obj.traverse((child) => {
                if (child.isMesh) {
                    originalMaterials.set(child, child.material);
                    child.material = child.material.clone();
                    child.material.emissive = new THREE.Color(0xff0000);
                    child.material.emissiveIntensity = 0.5;
                }
            });
        }

        function deselectObject() {
            if (selectedObject) {
                selectedObject.traverse((child) => {
                    if (child.isMesh && originalMaterials.has(child)) {
                        child.material = originalMaterials.get(child);
                    }
                });
                originalMaterials.clear();
                selectedObject = null;
            }
        }

        function rotateSelected() {
            if (selectedObject) {
                selectedObject.rotation.y += Math.PI / 4; // Rotate 45 degrees
            } else {
                alert('Click on an object first to select it!');
            }
        }

        function deleteSelected() {
            if (selectedObject) {
                scene.remove(selectedObject);
                const index = objects.indexOf(selectedObject);
                if (index > -1) objects.splice(index, 1);
                selectedObject = null;
            } else {
                alert('Click on an object first to select it!');
            }
        }

        function resetScene() {
            objects.forEach(obj => scene.remove(obj));
            objects.length = 0;
            selectedObject = null;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
