<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Home Design Studio</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; }
        
        /* 3D Canvas */
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* UI Overlay */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; width: 280px;
            background: rgba(30, 30, 30, 0.95); padding: 20px; border-radius: 12px;
            color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;
        }

        h1 { font-size: 18px; margin-bottom: 15px; color: #0066ff; text-transform: uppercase; letter-spacing: 1px; }
        
        .section-title { font-size: 12px; color: #888; margin: 15px 0 8px 0; text-transform: uppercase; }

        button {
            width: 100%; padding: 10px; margin-bottom: 8px; background: #2a2a2a;
            border: 1px solid #444; color: white; border-radius: 6px; cursor: pointer;
            font-size: 14px; transition: all 0.2s; text-align: left;
        }
        button:hover { background: #0066ff; border-color: #0066ff; }
        button:active { transform: scale(0.98); }

        .color-picker-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 6px; cursor: pointer; background: none; }

        .instructions { font-size: 11px; color: #666; margin-top: 20px; line-height: 1.5; border-top: 1px solid #333; padding-top: 10px; }

        #reset-btn { background: #8b0000; border-color: #a00; text-align: center; margin-top: 10px; }
        #reset-btn:hover { background: #ff3333; }
    </style>
</head>
<body>

    <!-- UI Panel -->
    <div id="ui-panel">
        <h1>🏠 Home Design Studio</h1>
        
        <div class="section-title">Build Structure</div>
        <button onclick="addFloor()">➕ Add Floor Tile</button>
        <button onclick="addWall()">➕ Add Wall</button>
        <button onclick="addPillar()">➕ Add Pillar</button>

        <div class="section-title">Furniture & Decor</div>
        <button onclick="addFurniture('box')">📦 Add Box / Table</button>
        <button onclick="addFurniture('sphere')">⚪ Add Sphere / Lamp</button>

        <div class="section-title">Customization</div>
        <div class="color-picker-container">
            <label style="font-size: 14px;">Next Object Color:</label>
            <input type="color" id="colorPicker" value="#0066ff">
        </div>

        <button id="reset-btn" onclick="resetScene()">🗑️ Clear All</button>

        <div class="instructions">
            <strong>Controls:</strong><br>
            🖱️ Left Click + Drag: Rotate<br>
            🖱️ Right Click + Drag: Pan<br>
            🖱️ Scroll: Zoom In/Out
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Three.js Library (The 3D Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // Dark background
        scene.fog = new THREE.Fog(0x1a1a1a, 20, 100); // Adds depth

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable shadows for realism
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- 2. CONTROLS (Rotate, Zoom, Pan) ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 3. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 4. GROUND GRID ---
        const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        scene.add(gridHelper);

        // Invisible plane for raycasting (optional future use)
        const planeGeometry = new THREE.PlaneGeometry(50, 50);
        const planeMaterial = new THREE.MeshBasicMaterial({ visible: false });
        const groundPlane = new THREE.Mesh(planeGeometry, planeMaterial);
        groundPlane.rotation.x = -Math.PI / 2;
        scene.add(groundPlane);

        // --- 5. OBJECT MANAGEMENT ---
        const objects = []; // Keep track of added objects
        let currentColor = '#0066ff';

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        function createMaterial(colorHex) {
            return new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                roughness: 0.7,
                metalness: 0.1
            });
        }

        function addMesh(geometry, material, x, y, z) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            objects.push(mesh);
        }

        // --- BUILDING FUNCTIONS ---
        function addFloor() {
            const geo = new THREE.BoxGeometry(2, 0.1, 2);
            const mat = createMaterial(currentColor);
            // Snap to grid
            const x = Math.round((Math.random() - 0.5) * 10); 
            const z = Math.round((Math.random() - 0.5) * 10);
            addMesh(geo, mat, x, 0.05, z);
        }

        function addWall() {
            const geo = new THREE.BoxGeometry(2, 3, 0.2);
            const mat = createMaterial(currentColor);
            const x = Math.round((Math.random() - 0.5) * 10);
            const z = Math.round((Math.random() - 0.5) * 10);
            addMesh(geo, mat, x, 1.5, z);
        }

        function addPillar() {
            const geo = new THREE.BoxGeometry(0.5, 4, 0.5);
            const mat = createMaterial(currentColor);
            const x = Math.round((Math.random() - 0.5) * 10);
            const z = Math.round((Math.random() - 0.5) * 10);
            addMesh(geo, mat, x, 2, z);
        }

        function addFurniture(type) {
            let geo;
            if (type === 'box') {
                geo = new THREE.BoxGeometry(1, 1, 1);
            } else if (type === 'sphere') {
                geo = new THREE.SphereGeometry(0.6, 32, 32);
            }
            const mat = createMaterial(currentColor);
            const x = Math.round((Math.random() - 0.5) * 10);
            const z = Math.round((Math.random() - 0.5) * 10);
            const y = type === 'sphere' ? 0.6 : 0.5;
            addMesh(geo, mat, x, y, z);
        }

        function resetScene() {
            objects.forEach(obj => scene.remove(obj));
            objects.length = 0;
        }

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. HANDLE WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
